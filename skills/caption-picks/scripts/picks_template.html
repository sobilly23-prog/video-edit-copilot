<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a contact-sheet column, one frame per question; the picked answer is previewed on the frame as the film's caption */
:root {
  --bg: #f3f2ef; --panel: #ffffff; --fg: #1d1c1a; --muted: #6b6862; --line: #dcd9d2;
  --accent: #2f5d50; --accent-soft: #e3ece8; --pill: rgba(0,0,0,.55);
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Figtree", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141615; --panel: #1c1f1e; --fg: #ecebe7; --muted: #a29f98; --line: #2e3230;
  --accent: #8fc2b0; --accent-soft: #23302c; --pill: rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141615; --panel: #1c1f1e; --fg: #ecebe7; --muted: #a29f98; --line: #2e3230;
  --accent: #8fc2b0; --accent-soft: #23302c; --pill: rgba(0,0,0,.6); color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 32px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
header h1 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(34px, 6vw, 48px); line-height: 1.05; margin: 0; text-wrap: balance; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
@media (max-width: 720px) { .q { grid-template-columns: minmax(0, 1fr); } }
.frame { position: relative; background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tc { position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 2px 6px; border-radius: 3px; letter-spacing: .02em; }
.cap { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); max-width: 88%; background: var(--pill); color: #fff;
  font-family: var(--sans); font-size: clamp(10px, 1.6vw, 13px); padding: 3px 9px; border-radius: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card { position: absolute; left: 5%; bottom: 8%; display: grid; gap: 4px; justify-items: start; max-width: 88%; }
.card .n { background: var(--pill); color: #fff; font-family: var(--serif); font-style: italic; font-size: clamp(13px, 2.4vw, 20px); padding: 1px 9px; border-radius: 6px; }
.card .a { background: var(--pill); color: #fff; font-size: clamp(9px, 1.3vw, 11px); padding: 2px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.body { padding: 16px 18px 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.body h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt b { font-family: var(--mono); font-weight: 400; color: var(--accent); margin-right: 6px; }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }
.other { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); }
.other:focus, .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.links a { color: var(--accent); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .in { max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar code { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1 1 320px; min-width: 0; overflow-wrap: anywhere; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--panel); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <h1>/*H1*/</h1>
    <p>/*INTRO*/</p>
  </header>
  <main id="qs" style="display:grid;gap:28px"></main>
</div>
<div class="bar"><div class="in"><code id="summary"></code><button id="copy" type="button">Copy my picks</button></div></div>

<script>
const DATA = /*DATA*/;
const qs = document.getElementById('qs');
let saved = {};
try { saved = JSON.parse(localStorage.getItem('/*KEY*/') || '{}'); } catch (e) {}
function store() { try { localStorage.setItem('/*KEY*/', JSON.stringify(saved)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function overlay(q, text) {
  if (!text) return '';
  if (q.kind === 'card') { const [n, a] = text.split(' | '); return `<div class="card"><span class="n">${esc(n)}</span>${a ? `<span class="a">${esc(a)}</span>` : ''}</div>`; }
  return `<div class="cap">${esc(text)}</div>`;
}
DATA.forEach((q, i) => {
  const el = document.createElement('section'); el.className = 'q'; el.id = 'q' + (i + 1);
  const opts = q.options.map((o, k) => {
    const letter = String.fromCharCode(65 + k);
    return `<label class="opt"><input type="radio" name="q${i}" value="${letter}" id="q${i}${letter}"><span><b>${letter}</b>${esc(o.text)}${o.why ? `<small>${esc(o.why)}</small>` : ''}</span></label>`;
  }).join('');
  el.innerHTML = `<div class="frame"><img alt="${esc(q.alt)}" src="${q.img}"><span class="tc">${esc(q.tc)}</span><div class="ov"></div></div>
    <div class="body"><div class="eyebrow">${i + 1} · ${esc(q.where)}</div><h2>${esc(q.title)}</h2>${q.note ? `<p class="note">${esc(q.note)}</p>` : ''}
    <div class="opts">${opts}</div>
    <input class="other" id="q${i}other" placeholder="Or type your own" value="">
    ${q.links.length ? `<div class="links">${q.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>` : ''}</div>`;
  qs.appendChild(el);
  const ov = el.querySelector('.ov');
  const pick = saved['q' + i] || { letter: 'A', other: '' };
  el.querySelector(`#q${i}${pick.letter}`) && (el.querySelector(`#q${i}${pick.letter}`).checked = true);
  el.querySelector(`#q${i}other`).value = pick.other || '';
  function render() {
    const other = el.querySelector(`#q${i}other`).value.trim();
    const r = el.querySelector(`input[name="q${i}"]:checked`);
    const letter = r ? r.value : 'A';
    saved['q' + i] = { letter, other }; store();
    const o = q.options[letter.charCodeAt(0) - 65];
    ov.innerHTML = overlay(q, other || (o && o.caption !== undefined ? o.caption : o.text));
    summarize();
  }
  el.addEventListener('input', render); el.addEventListener('change', render);
  render();
});
function summarize() {
  const parts = DATA.map((q, i) => { const p = saved['q' + i] || { letter: 'A' }; return p.other ? `${i + 1}: "${p.other}"` : `${i + 1}${p.letter}`; });
  document.getElementById('summary').textContent = '/*LABEL*/: ' + parts.join(', ');
}
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('summary').textContent; const b = document.getElementById('copy');
  try { await navigator.clipboard.writeText(t); b.textContent = 'Copied'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('summary')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected: press copy'; }
  setTimeout(() => b.textContent = 'Copy my picks', 2200);
});
</script>
